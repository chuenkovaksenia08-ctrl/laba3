{% extends 'movies/base.html' %}
{% block content %}
<div class="card shadow-sm" style="max-width: 500px; margin: 0 auto;">
    <div class="card-body text-center">
        <h3 class="mb-3 text-danger">Удалить фильм?</h3>
        <p>Вы уверены, что хотите удалить <strong>{{ movie.title }} ({{ movie.year }})</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'movies:list_all' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}

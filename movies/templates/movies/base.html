<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Фильмы{% endblock %}</title>
    <!-- Подключаем Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4 mb-5" style="max-width: 900px;">
        <h1 class="mb-3">🎬 Фильмы — JSON / XML / БД</h1>
        
        <nav class="nav nav-pills mb-4">
            <!-- Здесь исправлено list_files на list_all -->
            <a class="nav-link" href="{% url 'movies:index' %}">Добавить фильм</a>
            <a class="nav-link" href="{% url 'movies:upload' %}">Загрузить файл</a>
            <a class="nav-link" href="{% url 'movies:list_all' %}">Просмотр данных</a>
        </nav>

        {% if messages %}
            {% for m in messages %}
                <!-- Выводим сообщения с правильными цветами Bootstrap -->
                <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show">
                    {{ m }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
